<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecrutIA — Inscription RH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-page: #F4F7F6;
      --bg-white: #FFFFFF;
      --primary: #059669;
      --primary-light: #ECFDF5;
      --primary-hover: #047857;
      --accent-red: #DC2626;
      --accent-red-light: #FEE2E2;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.07), 0 4px 6px -4px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ECFDF5 0%, #F4F7F6 50%, #E6F4F1 100%);
      padding: 24px;
    }

    .auth-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), #047857);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin: 0 auto 12px;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
    }

    .auth-brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .auth-brand p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .auth-form { display: flex; flex-direction: column; gap: 16px; }

    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-white);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .form-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .btn-auth {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), #047857);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .btn-auth:hover { opacity: 0.92; transform: translateY(-1px); }

    .auth-error {
      padding: 10px 14px;
      background: var(--accent-red-light);
      border: 1px solid #FCA5A5;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--accent-red);
      display: none;
      margin-bottom: 16px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
    }

    .toast-msg {
      background: var(--primary);
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon"><i class="fa-solid fa-user-plus"></i></div>
      <h1>Inscription RecrutIA</h1>
      <p>Créez votre compte recruteur RH ArtiWeb</p>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <form id="form-register" class="auth-form" onsubmit="doRegister(event)">
      <div class="form-field">
        <label>Nom d'utilisateur</label>
        <input type="text" id="reg-user" placeholder="ex: rh_sarah" required minlength="3">
      </div>
      <div class="form-field">
        <label>Mot de passe (min. 6 caractères)</label>
        <input type="password" id="reg-pass" placeholder="••••••••" required minlength="6">
      </div>
      <button class="btn-auth" type="submit" id="btn-register">
        <i class="fa-solid fa-user-plus"></i> Créer mon compte
      </button>

      <p style="text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted);">
        Vous avez déjà un compte ? <a href="/rh" style="color: var(--primary); font-weight: 700; text-decoration: underline;">Se connecter ici</a>
      </p>
    </form>
  </div>

  <div id="toast"></div>

  <script>
    const API = window.location.protocol.startsWith('http') ? window.location.origin + '/api' : 'http://127.0.0.1:8000/api';

    function toast(msg) {
      const container = document.getElementById("toast");
      container.innerHTML = `<div class="toast-msg">${msg}</div>`;
      setTimeout(() => { container.innerHTML = ""; }, 3000);
    }

    async function doRegister(e) {
      e.preventDefault();
      const errorEl = document.getElementById("auth-error");
      errorEl.style.display = "none";
      
      const btn = document.getElementById("btn-register");
      btn.innerHTML = 'Création en cours...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("reg-user").value,
            password: document.getElementById("reg-pass").value
          })
        });
        const data = await res.json();
        if (res.ok) {
          toast("Compte créé avec succès !");
          setTimeout(() => {
            window.location.href = "/rh?registered=true";
          }, 1500);
        } else {
          errorEl.innerText = data.detail || "Erreur lors de l'inscription.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.innerText = "Erreur de connexion avec le serveur.";
        errorEl.style.display = "block";
      }
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer mon compte';
      btn.disabled = false;
    }
  </script>
</body>
</html>
