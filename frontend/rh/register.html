<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecrutIA — Inscription RH & Administrateur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-sidebar: #1E1B4B;
      --primary: #4F46E5;
      --accent-gold: #F59E0B;
      --accent-red: #DC2626;
      --accent-red-light: rgba(220, 38, 38, 0.2);
      --text-primary: #0F172A;
      --radius-sm: 8px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #090D16 100%);
      padding: 24px;
      color: #fff;
    }

    .auth-card {
      background: rgba(30, 27, 75, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent-gold), #D97706);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin: 0 auto 12px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
    }

    .auth-brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .auth-brand p {
      font-size: 13px;
      color: #A5B4FC;
      margin-top: 4px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #C7D2FE;
      margin-bottom: 6px;
    }

    .form-field input, .form-field select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: #FFF;
      background: rgba(255, 255, 255, 0.05);
      outline: none;
      transition: all 0.2s;
    }

    .form-field select option {
      background: #1E1B4B;
      color: #FFF;
    }

    .form-field input:focus, .form-field select:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    .btn-auth {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-gold), #D97706);
      color: #1E1B4B;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      margin-top: 8px;
    }

    .btn-auth:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .auth-error {
      padding: 12px 14px;
      background: var(--accent-red-light);
      border: 1px solid rgba(220, 38, 38, 0.4);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: #FCA5A5;
      display: none;
      margin-bottom: 16px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
    }

    .toast-msg {
      background: var(--accent-gold);
      color: #1E1B4B;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon"><i class="fa-solid fa-user-plus"></i></div>
      <h1>Créer un Compte</h1>
      <p>Espace Recruteur RH & Administrateur RecrutIA</p>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <form id="form-register" class="auth-form" onsubmit="doRegister(event)">
      <div class="form-field">
        <label><i class="fa-solid fa-user" style="color:var(--accent-gold);"></i> Nom d'utilisateur</label>
        <input type="text" id="reg-user" placeholder="ex: rh_sarah" required minlength="3">
      </div>

      <div class="form-field">
        <label><i class="fa-solid fa-key" style="color:var(--accent-gold);"></i> Mot de passe (min. 6 caractères)</label>
        <input type="password" id="reg-pass" placeholder="••••••••" required minlength="6">
      </div>

      <div class="form-field">
        <label><i class="fa-solid fa-lock" style="color:var(--accent-gold);"></i> Confirmer le mot de passe</label>
        <input type="password" id="reg-pass-confirm" placeholder="••••••••" required minlength="6">
      </div>

      <button class="btn-auth" type="submit" id="btn-register">
        <i class="fa-solid fa-user-plus"></i> Créer mon compte
      </button>

      <p style="text-align: center; margin-top: 18px; font-size: 13px; color: rgba(255,255,255,0.6);">
        Vous avez déjà un compte ? <a href="/rh" style="color: var(--accent-gold); font-weight: 700; text-decoration: underline;">Se connecter ici</a>
      </p>
    </form>
  </div>

  <div id="toast"></div>

  <script>
    const API = window.location.protocol.startsWith('http') ? window.location.origin + '/api' : 'http://127.0.0.1:8000/api';

    function toast(msg) {
      const container = document.getElementById("toast");
      container.innerHTML = `<div class="toast-msg">${msg}</div>`;
      setTimeout(() => { container.innerHTML = ""; }, 3000);
    }

    async function doRegister(e) {
      e.preventDefault();
      const errorEl = document.getElementById("auth-error");
      errorEl.style.display = "none";

      const pass = document.getElementById("reg-pass").value;
      const passConfirm = document.getElementById("reg-pass-confirm").value;

      if (pass !== passConfirm) {
        errorEl.innerText = "Les mots de passe ne correspondent pas.";
        errorEl.style.display = "block";
        return;
      }
      
      const btn = document.getElementById("btn-register");
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Création en cours...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("reg-user").value.trim(),
            password: pass,
            role: "recruteur"
          })
        });
        const data = await res.json();
        if (res.ok) {
          toast("Compte créé avec succès ! Redirection...");
          setTimeout(() => {
            window.location.href = "/rh?registered=true";
          }, 1200);
        } else {
          errorEl.innerText = data.detail || "Erreur lors de l'inscription.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.innerText = "Erreur de connexion avec le serveur.";
        errorEl.style.display = "block";
      }
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer mon compte';
      btn.disabled = false;
    }
  </script>
</body>
</html>
