  <script type="text/babel">

    const OFFRES_DEMO = [

      { id: 3, titre: 'Designer UI/UX Senior', experience_min_annees: 1, competences_obligatoires: ['Figma', 'Adobe XD', 'Prototypage', 'CSS'], description: 'Créez des chartes graphiques époustouflantes, des prototypes interactifs et garantissez une expérience utilisateur premium.' }

    // ── Typing Effect Component ──────────────────────────────────────────────
    function TypingText({ words }) {
      const [wordIdx, setWordIdx] = useState(0);
      const [displayed, setDisplayed] = useState('');
      const [deleting, setDeleting] = useState(false);
      const [pause, setPause] = useState(false);

      useEffect(() => {
        if (pause) {
          const t = setTimeout(() => { setPause(false); setDeleting(true); }, 1800);
          return () => clearTimeout(t);
        }
        const current = words[wordIdx];
        if (!deleting) {
          if (displayed.length < current.length) {
            const t = setTimeout(() => setDisplayed(current.slice(0, displayed.length + 1)), 60);
            return () => clearTimeout(t);
          } else {
            setPause(true);
          }
        } else {
          if (displayed.length > 0) {
            const t = setTimeout(() => setDisplayed(displayed.slice(0, -1)), 35);
            return () => clearTimeout(t);
          } else {
            setDeleting(false);
            setWordIdx((wordIdx + 1) % words.length);
          }
        }
      }, [displayed, deleting, pause, wordIdx]);

      return (
        <span class="shimmer-text font-outfit font-black">
          {displayed}<span class="animate-pulse" style={{WebkitTextFillColor:'#7dd3fc'}}>|</span>
        </span>
      );
    }

    // ── Animated Counter ─────────────────────────────────────────────────────
    function AnimCounter({ target, suffix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const started = useRef(false);

      useEffect(() => {
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting && !started.current) {
            started.current = true;
            let start = 0;
            const step = target / 60;
            const interval = setInterval(() => {
              start += step;
              if (start >= target) { setVal(target); clearInterval(interval); }
              else setVal(Math.round(start));
            }, 20);
          }
        }, { threshold: 0.4 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      return <span ref={ref}>{val}{suffix}</span>;
    }

    // ── Profile Showcase Card (right side hero) ───────────────────────────────
    function ProfileCard({ onApply }) {
      const skills = [
        { name: 'React / Next.js', pct: 92, color: '#f59e0b' },
        { name: 'Python / FastAPI',pct: 87, color: '#818cf8' },

      return (
        <div class="relative w-full max-w-sm mx-auto select-none">

          {/* Blurred orb background */}
          <div class="absolute -inset-8 bg-gradient-to-tr from-indigo-600 via-purple-600 to-amber-500 rounded-full blur-3xl opacity-25 animate-pulse" />

          {/* Outer orbital ring */}
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="spin-slow" style={{width:'420px',height:'420px',position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)'}}>
              <svg viewBox="0 0 420 420" style={{width:'100%',height:'100%'}}>
                <circle cx="210" cy="210" r="200" fill="none" stroke="rgba(245,158,11,0.2)" strokeWidth="1" strokeDasharray="6 10"/>
                <circle cx="210" cy="60" r="7" fill="#f59e0b" opacity="0.8"/>
                <circle cx="360" cy="290" r="5" fill="#4f46e5" opacity="0.7"/>
              </svg>
            </div>
            <div class="spin-slow-rev" style={{width:'310px',height:'310px',position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)'}}>
              <svg viewBox="0 0 310 310" style={{width:'100%',height:'100%'}}>
                <circle cx="155" cy="155" r="148" fill="none" stroke="rgba(79,70,229,0.18)" strokeWidth="1" strokeDasharray="4 14"/>
                <circle cx="155" cy="7" r="5" fill="#818cf8" opacity="0.8"/>
                <circle cx="300" cy="200" r="4" fill="#34d399" opacity="0.6"/>
              </svg>
            </div>
          </div>

          {/* Main glass card */}
          <div class="relative bg-gradient-to-b from-[#1E1B4B]/95 to-[#0F172A]/98 border border-indigo-500/40 rounded-3xl p-7 backdrop-blur-2xl shadow-2xl space-y-5 z-10"
               style={{boxShadow:'0 0 60px rgba(79,70,229,0.3), 0 30px 60px rgba(0,0,0,0.5)'}}>

            {/* Top badge row */}
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                {/* Avatar with radar */}
                <div class="relative w-12 h-12 flex-shrink-0">
                  <div class="radar-ring absolute inset-0 rounded-full bg-amber-400/20 border border-amber-400/30" />
                  <div class="radar-ring radar-ring-2 absolute inset-0 rounded-full bg-indigo-500/20 border border-indigo-500/30" />
                  <div class="radar-ring radar-ring-3 absolute inset-0 rounded-full bg-indigo-500/10 border border-indigo-500/20" />
                  <div class="relative w-12 h-12 bg-gradient-to-br from-amber-400 via-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-white font-black text-lg shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-user" />
                  </div>
                </div>
                <div>
                  <div class="text-white font-bold text-sm leading-tight">Profil Candidat</div>

                </div>

              <div class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                ✨ Match optimal

            </div>

            {/* Big score */}

                  </div>
                </div>
              ))}
            </div>

            {/* Tags */}
            <div class="flex flex-wrap gap-1.5 pt-1">
              {['NLP','FastAPI','React','Tailwind','SQL','Docker'].map((tag, i) => (
                <span key={i} class="bg-indigo-500/20 border border-indigo-500/35 text-indigo-200 text-[9px] font-bold px-2.5 py-1 rounded-full">
                  {tag}
                </span>
              ))}
            </div>

            {/* Footer info */}
            <div class="border-t border-slate-800/80 pt-4 flex justify-between text-[10px] text-slate-300">
              <span>Expérience : <strong class="text-white">3+ ans</strong></span>
              <span>Formation : <strong class="text-white">Ingénieur</strong></span>
              <span>Dispo : <strong class="text-emerald-400">Immédiate</strong></span>
            </div>

            {/* CTA inside card */}
            <button
              onClick={() => onApply('')}
              class="w-full bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 text-white font-extrabold text-xs py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all hover:opacity-95 hover:-translate-y-0.5"
              style={{boxShadow:'0 8px 24px rgba(79,70,229,0.4)'}}
            >

            </button>

          </div>
        </div>
      );
    }

    // ── 4-SECOND CINEMATIC INTRO SCREEN ──────────────────────────────────
    function SplashScreen({ onFinish }) {
      const [progress, setProgress] = useState(0);
      const [statusText, setStatusText] = useState('⚡ Connexion sécurisée au serveur RecrutIA...');
      const [fading, setFading] = useState(false);

      useEffect(() => {
        const startTime = Date.now();
        const duration = 4000; // 4 seconds exactly

        const interval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const pct = Math.min(100, Math.round((elapsed / duration) * 100));
          setProgress(pct);

          if (pct < 25) {
            setStatusText('⚡ Initialisation des serveurs ArtiWeb Fès...');
          } else if (pct < 60) {
            setStatusText('🧠 Démarrage du Moteur Scoring IA & NLP...');
          } else if (pct < 90) {
            setStatusText('✨ Chargement du Portail Candidat...');
          } else {
            setStatusText('🚀 Prêt ! Ouverture en cours...');
          }

          if (elapsed >= duration) {
            clearInterval(interval);
            setFading(true);
            setTimeout(() => {
              onFinish();
            }, 500); // 500ms smooth fade transition
          }
        }, 30);

        return () => clearInterval(interval);
      }, []);

      return (
        <div 
          style={{
            position: 'fixed',
            top: 0, left: 0, right: 0, bottom: 0,
            zIndex: 999999,
            backgroundColor: '#090D16',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            opacity: fading ? 0 : 1,
            pointerEvents: fading ? 'none' : 'auto',
            transition: 'opacity 0.5s ease-out'
          }}
        >
          {/* Animated Glowing Ambient Aura */}
          <div style={{
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%)',
            width: '450px',
            height: '450px',
            borderRadius: '50%',
            background: 'radial-gradient(circle, rgba(79,70,229,0.35) 0%, rgba(245,158,11,0.2) 50%, transparent 70%)',
            filter: 'blur(40px)',
            pointerEvents: 'none'
          }} />

          <div style={{ position: 'relative', zIndex: 10, maxWidth: '420px', width: '90%', textAlign: 'center' }}>
            
            {/* Animated Logo Icon */}
            <div style={{
              width: '88px',
              height: '88px',
              margin: '0 auto 24px',
              background: 'linear-gradient(135deg, #F59E0B, #4F46E5, #8B5CF6)',
              borderRadius: '24px',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              fontSize: '38px',
              color: '#FFFFFF',
              boxShadow: '0 12px 35px rgba(79,70,229,0.5)',
              border: '2px solid rgba(245,158,11,0.4)'
            }}>
              <i className="fa-solid fa-layer-group"></i>
            </div>

            {/* Brand Title */}
            <h1 style={{
              fontFamily: "'Outfit', sans-serif",

              color: '#FFFFFF',

            }}>

                background: 'linear-gradient(135deg, #F59E0B, #8B5CF6, #10B981)',
                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent'
              }}>IA</span>
            </h1>
            <p style={{
              fontSize: '11px',
              fontWeight: 800,
              color: '#F59E0B',
              textTransform: 'uppercase',
              letterSpacing: '2px',

            </div>

            {/* Progress Bar Container */}

              height: '10px',
              background: '#0F172A',
              borderRadius: '99px',
              overflow: 'hidden',

            }}>
              <div style={{
                height: '100%',
                width: `${progress}%`,
                background: 'linear-gradient(90deg, #F59E0B, #4F46E5, #10B981)',
                borderRadius: '99px',

              }} />

     // ── Formatted AI Evaluation Report Component ─────────────────────────────
    function EvaluationReport({ justification, score }) {
      if (!justification) {
        return (
          <div class="bg-[#0F172A]/80 border border-indigo-500/30 rounded-2xl p-5 text-slate-300 text-xs text-center font-medium">
            Votre dossier a été transmis avec succès aux équipes de recrutement pour évaluation.
          </div>
        );
      }

      // Parser logic for structured IA justification
      const raw = justification;
      
      const techMatch = raw.match(/Technique\s*([\d\.]+)%/i);
      const expMatch = raw.match(/Expérience\s*([\d\.]+)%/i);
      const softMatch = raw.match(/Soft Skills\s*([\d\.]+)%/i);
      const formMatch = raw.match(/Formation\s*([\d\.]+)%/i);
      
      const seuilMatch = raw.match(/Seuil Minimal[^\:]*:\s*([\d\.]+)%/i);
      const apprecMatch = raw.match(/Appréciation IA\s*:\s*([^\.]+)\./i);
      
      // Points Forts
      let pointsForts = [];
      const pfMatch = raw.match(/Points Forts Détectés\s*:\s*([^🛡️]+?)(?:Axes d'Amélioration|Audit d'Impartialité|$)/i);
      if (pfMatch) {
        pointsForts = pfMatch[1].split('•').map(s => s.trim()).filter(s => s.length > 2);
      }
      
      // Axes d'Amélioration
      let axesAmelioration = [];
      const axesMatch = raw.match(/Axes d'Amélioration[^\:]*:\s*([^🛡️]+?)(?:Audit d'Impartialité|$)/i);
      if (axesMatch) {
        axesAmelioration = axesMatch[1].split('•').map(s => s.trim()).filter(s => s.length > 2);
      }

      const has4D = techMatch || expMatch || softMatch || formMatch;
      const techVal = techMatch ? parseFloat(techMatch[1]) : 50;
      const expVal = expMatch ? parseFloat(expMatch[1]) : 50;
      const softVal = softMatch ? parseFloat(softMatch[1]) : 50;
      const formVal = formMatch ? parseFloat(formMatch[1]) : 50;
      const seuilVal = seuilMatch ? parseFloat(seuilMatch[1]) : 70;
      const appreciation = apprecMatch ? apprecMatch[1].trim() : (score >= seuilVal ? 'RECOMMANDÉ' : 'EN COURS D\'EXAMEN');

      return (
        <div class="space-y-4 text-left">
          
          {/* Header Status & Seuil */}
          <div class="flex items-center justify-between flex-wrap gap-2 bg-slate-900/90 border border-indigo-500/40 rounded-xl p-3.5 shadow-md">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span class="text-xs font-black text-white uppercase tracking-wider">Appréciation IA :</span>
              <span class={`text-xs font-black px-2.5 py-0.5 rounded-md ${
                appreciation.includes('RECOMMANDÉ') || score >= seuilVal 
                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
                  : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
              }`}>
                {appreciation}
              </span>
            </div>
            <div class="text-[11px] font-bold text-slate-300">
              Seuil minimal requis : <span class="text-amber-400 font-extrabold">{seuilVal}%</span>
            </div>
          </div>

          {/* 4 Dimensions Grid */}
          {has4D && (
            <div class="space-y-2">
              <div class="text-[11px] font-extrabold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-chart-pie"></i> Décomposition des 4 sous-scores IA :
              </div>
              
              <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                
                {/* Tech */}
                <div class="bg-indigo-950/60 border border-indigo-500/40 rounded-xl p-3 space-y-1.5 shadow-sm">
                  <div class="flex justify-between text-[11px] font-bold text-indigo-200">
                    <span><i class="fa-solid fa-code text-indigo-400 mr-1"></i> Technique (40%)</span>
                    <span class="font-black text-white">{techVal}%</span>
                  </div>
                  <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-indigo-500/30">
                    <div class="bg-gradient-to-r from-indigo-500 to-sky-400 h-full rounded-full transition-all duration-1000" style={{ width: `${Math.min(100, techVal)}%` }}></div>
                  </div>
                </div>

                {/* Exp */}
                <div class="bg-purple-950/60 border border-purple-500/40 rounded-xl p-3 space-y-1.5 shadow-sm">
                  <div class="flex justify-between text-[11px] font-bold text-purple-200">
                    <span><i class="fa-solid fa-briefcase text-purple-400 mr-1"></i> Expérience (25%)</span>
                    <span class="font-black text-white">{expVal}%</span>

                  <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-purple-500/30">
                    <div class="bg-gradient-to-r from-purple-500 to-pink-400 h-full rounded-full transition-all duration-1000" style={{ width: `${Math.min(100, expVal)}%` }}></div>
                  </div>
                </div>

                {/* Soft */}
                <div class="bg-emerald-950/60 border border-emerald-500/40 rounded-xl p-3 space-y-1.5 shadow-sm">
                  <div class="flex justify-between text-[11px] font-bold text-emerald-200">
                    <span><i class="fa-solid fa-comments text-emerald-400 mr-1"></i> Soft Skills (20%)</span>
                    <span class="font-black text-white">{softVal}%</span>
                  </div>
                  <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-emerald-500/30">
                    <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-1000" style={{ width: `${Math.min(100, softVal)}%` }}></div>
                  </div>
                </div>

                {/* Form */}
                <div class="bg-amber-950/60 border border-amber-500/40 rounded-xl p-3 space-y-1.5 shadow-sm">
                  <div class="flex justify-between text-[11px] font-bold text-amber-200">
                    <span><i class="fa-solid fa-graduation-cap text-amber-400 mr-1"></i> Formation (15%)</span>
                    <span class="font-black text-white">{formVal}%</span>
                  </div>
                  <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-amber-500/30">
                    <div class="bg-gradient-to-r from-amber-500 to-orange-400 h-full rounded-full transition-all duration-1000" style={{ width: `${Math.min(100, formVal)}%` }}></div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* Points Forts Détectés */}
          {pointsForts.length > 0 && (
            <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3.5 space-y-2">
              <div class="text-[11px] font-extrabold text-emerald-300 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-400"></i> Points Forts Détectés :
              </div>
              <ul class="space-y-1.5 text-xs text-slate-200 pl-1">
                {pointsForts.map((pt, idx) => (
                  <li key={idx} class="flex items-start gap-2">
                    <span class="text-emerald-400 font-bold mt-0.5">✓</span>
                    <span>{pt}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* Axes d'Amélioration */}
          {axesAmelioration.length > 0 && (
            <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3.5 space-y-2">
              <div class="text-[11px] font-extrabold text-amber-300 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-lightbulb text-amber-400"></i> Axes d'Amélioration & Compétences suggérées :
              </div>
              <ul class="space-y-1.5 text-xs text-slate-200 pl-1">
                {axesAmelioration.map((ax, idx) => (
                  <li key={idx} class="flex items-start gap-2">
                    <span class="text-amber-400 font-bold mt-0.5">⚠️</span>
                    <span>{ax}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* Fallback if no specific structured sections parsed */}
          {!has4D && pointsForts.length === 0 && (
            <div class="bg-[#0F172A]/80 border border-indigo-500/30 rounded-2xl p-4 text-slate-200 text-xs leading-relaxed">
              {raw}
            </div>
          )}

          {/* Audit d'Impartialité Footer */}
          <div class="bg-indigo-950/50 border border-indigo-500/30 rounded-xl p-3 flex items-start gap-2.5 text-[11px] text-slate-300">
            <i class="fa-solid fa-shield-halved text-indigo-400 text-sm mt-0.5"></i>
            <div>
              <strong class="text-indigo-200">Garantie d'Impartialité IA :</strong> Évaluation algorithmique basée exclusivement sur les compétences et l'expérience. Sans aucun biais de genre, âge, origine ou apparence.
            </div>
          </div>

        </div>
      );
    }

    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [offres, setOffres] = useState([]);
      const [selectedOffreId, setSelectedOffreId] = useState('');
      const [modalOpen, setModalOpen] = useState(false);
      const [detailOffreModal, setDetailOffreModal] = useState(null);
      
      // Form fields
      const [nom, setNom] = useState('');
      const [email, setEmail] = useState('');
      const [file, setFile] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      // Status tracking
      const [suiviEmail, setSuiviEmail] = useState('');
      const [suiviResult, setSuiviResult] = useState(null);
      const [suiviLoading, setSuiviLoading] = useState(false);

      // Submission state
      const [submitting, setSubmitting] = useState(false);
      const [submissionResult, setSubmissionResult] = useState(null);

      const fileInputRef = useRef(null);

      // Load offers from API
      useEffect(() => {
        const fetchOffres = async () => {
          try {
            const res = await fetch(`${API_BASE}/offres`);
            if (res.ok) {
              const data = await res.json();
              setOffres(data && data.length > 0 ? data : OFFRES_DEMO);
            } else {
              setOffres(OFFRES_DEMO);
            }
          } catch (e) {
            setOffres(OFFRES_DEMO);
          }
        };
        fetchOffres();
        
        // Auto fill email from localstorage
        const savedEmail = localStorage.getItem('candidat_email');
        if (savedEmail) setSuiviEmail(savedEmail);
      }, []);

      // Scroll helpers
      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const handleOpenModal = (offreId = '') => {
        setSelectedOffreId(offreId);
        setSubmissionResult(null);
        setFile(null);
        setModalOpen(true);
      };

      const handleCloseModal = () => {
        setModalOpen(false);
        setNom('');
        setEmail('');
        setFile(null);
      };

      const handleFileChange = (e) => {
        if (e.target.files.length > 0) {
          setFile(e.target.files[0]);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files.length > 0) {
          setFile(e.dataTransfer.files[0]);
        }
      };

      // Submit application
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!file) {
          alert('Veuillez déposer ou sélectionner votre CV.');
          return;
        }
        setSubmitting(true);
        setSubmissionResult(null);

        const formData = new FormData();
        formData.append('offre_id', selectedOffreId);
        formData.append('nom_candidat', nom);
        formData.append('email_candidat', email);
        formData.append('fichier_cv', file);

        try {
          const res = await fetch(`${API_BASE}/candidatures`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            setSubmissionResult(data);
            localStorage.setItem('candidat_email', email.trim());
          } else {
            setSubmissionResult({ error: true, message: data.detail || 'Erreur lors du traitement du CV.' });
          }
        } catch (err) {
          setSubmissionResult({ error: true, message: 'Impossible de joindre le serveur API.' });
        } finally {
          setSubmitting(false);
        }
      };

      // Search application
      const handleSuivi = async (e) => {
        e.preventDefault();
        if (!suiviEmail || !suiviEmail.includes('@')) {
          alert('Veuillez saisir un e-mail valide.');
          return;
        }
        setSuiviLoading(true);
        setSuiviResult(null);

        try {
          const res = await fetch(`${API_BASE}/candidatures?email=${encodeURIComponent(suiviEmail.trim())}`);
          if (res.ok) {
            const data = await res.json();
            setSuiviResult(data);
          } else {
            const errData = await res.json().catch(() => ({}));
            setSuiviResult({ error: true, message: errData.detail || 'Aucune candidature enregistrée pour cet adresse e-mail.' });
          }
        } catch (err) {
          setSuiviResult({ error: true, message: 'Erreur de recherche d\'e-mail.' });
        } finally {
          setSuiviLoading(false);
        }
      };

      const handleConfirmerEntretien = async (candId, choix) => {
        try {
          const res = await fetch(`${API_BASE}/candidatures/${candId}/confirmer-entretien`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ choix })
          });
          const data = await res.json();
          if (res.ok) {
            alert(data.message || 'Réponse enregistrée !');
            const r = await fetch(`${API_BASE}/candidatures?email=${encodeURIComponent(suiviEmail.trim())}`);
            if (r.ok) setSuiviResult(await r.json());
          } else {
            alert(data.detail || 'Erreur lors de la transmission de la réponse.');
          }
        } catch(e) {
          alert('Erreur de connexion au serveur.');
        }
      };

      const handleEnvoyerMessageRH = async (candId) => {
        const inputEl = document.getElementById(`msg-input-${candId}`);
        if (!inputEl || !inputEl.value.trim()) return;
        const msgText = inputEl.value.trim();

        try {
          const res = await fetch(`${API_BASE}/candidatures/${candId}/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msgText })
          });
          const data = await res.json();
          if (res.ok) {
            inputEl.value = '';
            alert('Votre message a été transmis à l\'équipe RH !');
            const r = await fetch(`${API_BASE}/candidatures?email=${encodeURIComponent(suiviEmail.trim())}`);
            if (r.ok) setSuiviResult(await r.json());
          } else {
            alert(data.detail || 'Erreur lors de l\'envoi du message.');
          }
        } catch(e) {
          alert('Erreur de connexion au serveur.');
        }
      };

      return (
        <div class="relative min-h-screen z-10">

              <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 bg-gradient-to-br from-amber-400 via-indigo-600 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/30 border border-amber-400/30 group-hover:scale-105 transition-transform">
                  <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                  <h1 class="font-outfit font-extrabold text-xl tracking-tight text-white">RECRUT<span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-indigo-300 to-emerald-400">IA</span></h1>
                  <p class="text-[9px] uppercase tracking-widest text-amber-400 font-extrabold">ArtiWeb Fès &bull; Espace Candidat</p>
                </div>
              </a>

              <nav class="flex items-center gap-1.5 sm:gap-4">
                <button onClick={() => scrollToSection('offres-section')} class="hidden md:flex text-slate-200 hover:text-amber-400 px-3 sm:px-4 py-2 rounded-full hover:bg-amber-400/10 transition-all text-xs sm:text-sm font-bold">
                  <i class="fa-solid fa-briefcase text-amber-400 mr-1.5 sm:mr-2 mt-0.5"></i> <span class="hidden sm:inline">Offres d'emploi</span><span class="sm:hidden">Offres</span>
                </button>
                <button onClick={() => scrollToSection('suivi-section')} class="text-slate-200 hover:text-amber-400 px-2.5 sm:px-4 py-2 rounded-full hover:bg-indigo-500/10 transition-all text-xs sm:text-sm font-bold">
                  <i class="fa-solid fa-magnifying-glass text-indigo-400 mr-1 sm:mr-2 mt-0.5"></i> <span class="hidden sm:inline">Suivre ma candidature</span><span class="sm:hidden">Suivi</span>
                </button>
                <button onClick={() => handleOpenModal('')} class="bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 hover:from-amber-400 hover:to-indigo-500 text-white font-extrabold text-xs sm:text-sm px-3 sm:px-6 py-2 sm:py-2.5 rounded-full shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 active:scale-95 transition-all whitespace-nowrap">
                  <i class="fa-solid fa-paper-plane mr-1 sm:mr-2"></i> <span class="hidden sm:inline">Postuler maintenant</span><span class="sm:hidden">Postuler</span>
                </button>
              </nav>

            </div>
          </header>

          {/* ═══════════════════════════════════════════════════════
               HERO SECTION — Animated Entry for Candidat Profile
               ═══════════════════════════════════════════════════════ */}
          <section class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-24 overflow-hidden">

            {/* Floating ambient particles */}
            <div class="absolute inset-0 pointer-events-none overflow-hidden">
              {[
                {w:6,h:6,t:'10%',l:'6%',  bg:'rgba(245,158,11,0.55)', dur:'6.2s', del:'0s'  },
                {w:4,h:4,t:'28%',l:'15%', bg:'rgba(99,102,241,0.45)', dur:'8.5s', del:'1.1s'},
                {w:8,h:8,t:'65%',l:'4%',  bg:'rgba(16,185,129,0.4)',  dur:'7s',   del:'2.2s'},
                {w:5,h:5,t:'80%',l:'20%', bg:'rgba(245,158,11,0.4)',  dur:'9.3s', del:'0.7s'},
                {w:3,h:3,t:'38%',l:'91%', bg:'rgba(99,102,241,0.6)',  dur:'5.5s', del:'1.8s'},
                {w:7,h:7,t:'15%',l:'84%', bg:'rgba(16,185,129,0.45)', dur:'10s',  del:'3.2s'},
                {w:4,h:4,t:'90%',l:'76%', bg:'rgba(245,158,11,0.35)', dur:'6.8s', del:'0.5s'},
                {w:6,h:6,t:'52%',l:'95%', bg:'rgba(99,102,241,0.3)',  dur:'8.8s', del:'2.8s'},
              ].map((p, i) => (

                  background:p.bg,

                }} />
              ))}
            </div>

            {/* Two-column layout */}
            <div class="relative flex flex-col lg:flex-row items-center gap-16 z-10">

              {/* ── LEFT: Text column ── */}
              <div class="flex-1 text-center lg:text-left space-y-8">

                {/* Pill badge */}
                <div class="animate-slide-up delay-1 inline-flex items-center gap-2.5 bg-amber-500/15 border border-amber-500/35 text-amber-300 px-5 py-2 rounded-full text-xs font-extrabold font-outfit uppercase tracking-widest shadow-md">
                  <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" />
                  <i class="fa-solid fa-wand-magic-sparkles text-amber-400" /> Espace Candidat &bull; ArtiWeb Fès
                </div>

                {/* Big title with typing effect */}
                <div class="animate-slide-up delay-2 space-y-3">
                  <h2 class="font-outfit font-black text-4xl sm:text-5xl lg:text-[3.6rem] text-white leading-[1.12] tracking-tight">
                    Votre profil,<br />évalué par{' '}
                    <TypingText words={["l'Intelligence Artificielle", "notre moteur NLP", "RecrutIA en temps réel", "l'IA d'ArtiWeb"]} />
                  </h2>
                </div>

                {/* Description */}
                <p class="animate-slide-up delay-3 text-slate-300 text-base sm:text-lg max-w-xl mx-auto lg:mx-0 font-medium leading-relaxed">
                  Déposez votre CV en un clic. Notre algorithme intelligent évalue votre profil, calcule un <strong class="text-amber-400 font-bold">score d'adéquation sémantique</strong> et vous offre un suivi en temps réel.
                </p>

                {/* CTA buttons */}
                <div class="animate-slide-up delay-4 flex flex-wrap items-center justify-center lg:justify-start gap-4">
                  <button
                    onClick={() => handleOpenModal('')}
                    class="group relative bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 text-white font-extrabold px-9 py-3.5 rounded-full shadow-xl hover:shadow-indigo-500/40 transition-all hover:-translate-y-1 text-sm overflow-hidden active:scale-95"
                    style={{boxShadow:'0 8px 32px rgba(79,70,229,0.35)'}}
                  >
                    <span class="relative z-10 flex items-center gap-2">
                      <i class="fa-solid fa-paper-plane" /> Déposer mon CV

                  </button>
                  <button
                    onClick={() => scrollToSection('offres-section')}
                    class="bg-[#1E1B4B]/80 border border-indigo-500/40 text-white font-bold px-9 py-3.5 rounded-full hover:bg-indigo-500/20 hover:-translate-y-1 transition-all text-sm active:scale-95"
                  >
                    <i class="fa-solid fa-briefcase text-amber-400 mr-2" /> Voir les offres
                  </button>
                </div>

                {/* Animated stats row */}
                <div class="animate-slide-up delay-5 flex flex-wrap gap-6 justify-center lg:justify-start pt-2">

                    { val: 120, suf:'+',  label: 'Candidats analysés', icon: 'fa-users',       color: '#818cf8' },
                    { val: 24,  suf:'h',  label: 'Réponse garantie',   icon: 'fa-clock',       color: '#34d399' },
                  ].map((s, i) => (

                      <i class={`fa-solid ${s.icon} text-base`} style={{color: s.color}} />
                      <div>
                        <div class="font-outfit font-black text-xl text-white leading-none">
                          <AnimCounter target={s.val} suffix={s.suf} />
                        </div>
                        <div class="text-slate-500 text-[10px] font-semibold mt-0.5">{s.label}</div>
                      </div>
                    </div>
                  ))}
                </div>

              </div>{/* end left */}

              {/* ── RIGHT: Profile Card ── */}
              <div class="flex-1 flex justify-center w-full">
                <ProfileCard onApply={handleOpenModal} />

          </section>

          <section id="offres-section" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 border-t border-slate-800/60">
            
            <div class="text-center max-w-xl mx-auto space-y-3 mb-16">
              <h3 class="font-outfit font-black text-3xl sm:text-4xl text-white">Nos opportunités <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-indigo-400 to-emerald-400">actives</span></h3>
              <p class="text-slate-300 text-sm font-medium">Postulez directement en ligne et laissez notre moteur IA analyser vos compétences en temps réel.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              {offres.map((o, idx) => {
                const icons = ['fa-code', 'fa-brain', 'fa-palette', 'fa-database', 'fa-server'];
                const icon = icons[idx % icons.length];
                const comps = o.competences_obligatoires || o.competences || [];
                const badgeStyles = [
                  'bg-amber-500/20 text-amber-300 border-amber-500/40',
                  'bg-indigo-500/20 text-indigo-300 border-indigo-500/40',
                  'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
                  'bg-purple-500/20 text-purple-300 border-purple-500/40'
                ];

                return (
                  <div key={o.id} class="bg-gradient-to-b from-[#1E1B4B]/80 to-[#0F172A]/90 border border-indigo-500/30 rounded-3xl p-7 flex flex-col justify-between backdrop-blur-xl shadow-xl hover:border-amber-400/60 hover:shadow-indigo-500/25 hover:-translate-y-1.5 transition-all duration-300">
                    
                    <div class="space-y-4">
                      <div class="flex items-center justify-between flex-wrap gap-2">

                          <i class={`fa-solid ${icon}`}></i>

                      <h4 class="font-outfit font-bold text-xl text-white tracking-tight">{o.titre}</h4>

                      <div class="flex flex-wrap gap-1.5 pt-2">

                            </div>

                            </div>

                            {file && (

                  </div>

                  {/* Grid Infos Clés */}
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="bg-slate-900/80 border border-indigo-500/30 rounded-2xl p-3 text-center space-y-1">
                      <div class="text-amber-400 text-sm"><i class="fa-solid fa-clock"></i></div>
                      <div class="text-[10px] text-slate-400 font-bold uppercase">Expérience</div>
                      <div class="text-xs font-black text-white">{detailOffreModal.experience_min_annees} an(s) min</div>
                    </div>
                    <div class="bg-slate-900/80 border border-indigo-500/30 rounded-2xl p-3 text-center space-y-1">
                      <div class="text-indigo-400 text-sm"><i class="fa-solid fa-graduation-cap"></i></div>
                      <div class="text-[10px] text-slate-400 font-bold uppercase">Formation</div>
                      <div class="text-xs font-black text-white">{detailOffreModal.formation_exigee || 'Master / Ingénieur'}</div>
                    </div>
                    <div class="bg-slate-900/80 border border-indigo-500/30 rounded-2xl p-3 text-center space-y-1">
                      <div class="text-emerald-400 text-sm"><i class="fa-solid fa-location-dot"></i></div>
                      <div class="text-[10px] text-slate-400 font-bold uppercase">Localisation</div>
                      <div class="text-xs font-black text-white">{detailOffreModal.localisation || 'Fès, Maroc'}</div>
                    </div>
                    <div class="bg-slate-900/80 border border-indigo-500/30 rounded-2xl p-3 text-center space-y-1">
                      <div class="text-purple-400 text-sm"><i class="fa-solid fa-money-bill-wave"></i></div>
                      <div class="text-[10px] text-slate-400 font-bold uppercase">Rémunération</div>
                      <div class="text-xs font-black text-white">{detailOffreModal.salaire_estime || 'Selon profil'}</div>
                    </div>
                  </div>

                  {/* Description complète */}
                  <div class="bg-[#0F172A]/80 border border-indigo-500/30 rounded-2xl p-5 space-y-2">
                    <div class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
                      <i class="fa-solid fa-align-left"></i> Description des Missions & Responsabilités :
                    </div>
                    <p class="text-slate-200 text-xs sm:text-sm leading-relaxed font-medium whitespace-pre-line">
                      {detailOffreModal.description}
                    </p>
                  </div>

                  {/* Compétences Obligatoires */}
                  <div class="space-y-2">
                    <div class="text-xs font-black text-red-400 uppercase tracking-wider flex items-center gap-2">
                      <i class="fa-solid fa-star"></i> Compétences Obligatoires Requises :
                    </div>
                    <div class="flex flex-wrap gap-2">
                      {(Array.isArray(detailOffreModal.competences_obligatoires) ? detailOffreModal.competences_obligatoires : (typeof detailOffreModal.competences_obligatoires === 'string' ? detailOffreModal.competences_obligatoires.split(',') : [])).map((c, i) => (
                        <span key={i} class="bg-red-500/15 border border-red-500/40 text-red-300 text-xs font-extrabold px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1.5">
                          <i class="fa-solid fa-check text-[10px]"></i> {c.trim()}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Compétences Souhaitées */}
                  {detailOffreModal.competences_souhaitees && (Array.isArray(detailOffreModal.competences_souhaitees) ? detailOffreModal.competences_souhaitees.length > 0 : detailOffreModal.competences_souhaitees.length > 0) && (
                    <div class="space-y-2">
                      <div class="text-xs font-black text-purple-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Compétences Souhaitées (Bonus IA) :
                      </div>
                      <div class="flex flex-wrap gap-2">
                        {(Array.isArray(detailOffreModal.competences_souhaitees) ? detailOffreModal.competences_souhaitees : detailOffreModal.competences_souhaitees.split(',')).map((c, i) => (
                          <span key={i} class="bg-purple-500/15 border border-purple-500/40 text-purple-300 text-xs font-extrabold px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> {c.trim()}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Footer CTAs */}
                  <div class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-4 border-t border-slate-800/80">
                    <button 
                      onClick={() => setDetailOffreModal(null)} 
                      class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs px-6 py-3.5 rounded-xl transition-all"
                    >
                      Fermer
                    </button>
                    <button 
                      onClick={() => {
                        const oid = detailOffreModal.id;
                        setDetailOffreModal(null);
                        handleOpenModal(oid);
                      }} 
                      class="w-full sm:w-auto bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 hover:from-amber-400 hover:to-indigo-500 text-white font-extrabold text-xs px-8 py-3.5 rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 active:scale-95"
                    >
                      <i class="fa-solid fa-paper-plane"></i> Postuler à cette offre maintenant
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
