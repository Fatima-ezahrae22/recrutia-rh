    // ── Typing Effect Component ──────────────────────────────────────────────
    function TypingText({ words }) {
      const [wordIdx, setWordIdx] = useState(0);
      const [displayed, setDisplayed] = useState('');
      const [deleting, setDeleting] = useState(false);
      const [pause, setPause] = useState(false);

      useEffect(() => {
        if (pause) {
          const t = setTimeout(() => { setPause(false); setDeleting(true); }, 1800);
          return () => clearTimeout(t);
        }
        const current = words[wordIdx];
        if (!deleting) {
          if (displayed.length < current.length) {
            const t = setTimeout(() => setDisplayed(current.slice(0, displayed.length + 1)), 60);
            return () => clearTimeout(t);
          } else {
            setPause(true);
          }
        } else {
          if (displayed.length > 0) {
            const t = setTimeout(() => setDisplayed(displayed.slice(0, -1)), 35);
            return () => clearTimeout(t);
          } else {
            setDeleting(false);
            setWordIdx((wordIdx + 1) % words.length);
          }
        }
      }, [displayed, deleting, pause, wordIdx]);

      return (
        <span class="shimmer-text font-outfit font-black">
          {displayed}<span class="animate-pulse" style={{WebkitTextFillColor:'#7dd3fc'}}>|</span>
        </span>
      );
    }

    // ── Animated Counter ─────────────────────────────────────────────────────
    function AnimCounter({ target, suffix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const started = useRef(false);

      useEffect(() => {
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting && !started.current) {
            started.current = true;
            let start = 0;
            const step = target / 60;
            const interval = setInterval(() => {
              start += step;
              if (start >= target) { setVal(target); clearInterval(interval); }
              else setVal(Math.round(start));
            }, 20);
          }
        }, { threshold: 0.4 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      return <span ref={ref}>{val}{suffix}</span>;
    }

    // ── Profile Showcase Card (right side hero) ───────────────────────────────

              <svg viewBox="0 0 310 310" style={{width:'100%',height:'100%'}}>

          {/* Main glass card */}

            {/* Tags */}
            <div class="flex flex-wrap gap-1.5 pt-1">
              {['NLP','FastAPI','React','Tailwind','SQL','Docker'].map((tag, i) => (
                <span key={i} class="bg-indigo-500/20 border border-indigo-500/35 text-indigo-200 text-[9px] font-bold px-2.5 py-1 rounded-full">

    }

    // ── 4-SECOND CINEMATIC INTRO SCREEN ──────────────────────────────────
    function SplashScreen({ onFinish }) {
      const [progress, setProgress] = useState(0);
      const [statusText, setStatusText] = useState('⚡ Connexion sécurisée au serveur RecrutIA...');
      const [fading, setFading] = useState(false);

      useEffect(() => {
        const startTime = Date.now();
        const duration = 4000; // 4 seconds exactly

        const interval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const pct = Math.min(100, Math.round((elapsed / duration) * 100));
          setProgress(pct);

          if (pct < 25) {
            setStatusText('⚡ Initialisation des serveurs ArtiWeb Fès...');
          } else if (pct < 60) {
            setStatusText('🧠 Démarrage du Moteur Scoring IA & NLP...');
          } else if (pct < 90) {
            setStatusText('✨ Chargement du Portail Candidat...');
          } else {
            setStatusText('🚀 Prêt ! Ouverture en cours...');
          }

          if (elapsed >= duration) {
            clearInterval(interval);
            setFading(true);
            setTimeout(() => {
              onFinish();
            }, 500); // 500ms smooth fade transition
          }
        }, 30);

        return () => clearInterval(interval);
      }, []);

      return (
        <div 
          style={{
            position: 'fixed',
            top: 0, left: 0, right: 0, bottom: 0,
            zIndex: 999999,
            backgroundColor: '#090D16',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            opacity: fading ? 0 : 1,
            pointerEvents: fading ? 'none' : 'auto',
            transition: 'opacity 0.5s ease-out'
          }}
        >
          {/* Animated Glowing Ambient Aura */}
          <div style={{
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%)',
            width: '450px',
            height: '450px',
            borderRadius: '50%',
            background: 'radial-gradient(circle, rgba(79,70,229,0.35) 0%, rgba(245,158,11,0.2) 50%, transparent 70%)',
            filter: 'blur(40px)',
            pointerEvents: 'none'
          }} />

          <div style={{ position: 'relative', zIndex: 10, maxWidth: '420px', width: '90%', textAlign: 'center' }}>
            
            {/* Animated Logo Icon */}
            <div style={{
              width: '88px',
              height: '88px',

              background: 'linear-gradient(135deg, #F59E0B, #4F46E5, #8B5CF6)',
              borderRadius: '24px',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',

              color: '#FFFFFF',
              boxShadow: '0 12px 35px rgba(79,70,229,0.5)',
              border: '2px solid rgba(245,158,11,0.4)'

            </div>

            {/* Brand Title */}

              fontFamily: "'Outfit', sans-serif",

                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent'
              }}>IA</span>
            </h1>

              fontSize: '11px',
              fontWeight: 800,

            {/* Progress Bar Container */}

              height: '10px',
              background: '#0F172A',
              borderRadius: '99px',
              overflow: 'hidden',
              border: '1.5px solid rgba(99,102,241,0.4)',
              padding: '2px',
              boxShadow: 'inset 0 2px 4px rgba(0,0,0,0.5)'
            }}>
              <div style={{
                height: '100%',
                width: `${progress}%`,
                background: 'linear-gradient(90deg, #F59E0B, #4F46E5, #10B981)',
                borderRadius: '99px',
                transition: 'width 0.08s ease-out'
              }} />

    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [offres, setOffres] = useState([]);
      const [selectedOffreId, setSelectedOffreId] = useState('');
      const [modalOpen, setModalOpen] = useState(false);
      
      // Form fields
      const [nom, setNom] = useState('');
      const [email, setEmail] = useState('');
      const [file, setFile] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      // Status tracking
      const [suiviEmail, setSuiviEmail] = useState('');
      const [suiviResult, setSuiviResult] = useState(null);
      const [suiviLoading, setSuiviLoading] = useState(false);

      // Submission state
      const [submitting, setSubmitting] = useState(false);
      const [submissionResult, setSubmissionResult] = useState(null);

      const fileInputRef = useRef(null);

      // Load offers from API
      useEffect(() => {
        const fetchOffres = async () => {
          try {
            const res = await fetch(`${API_BASE}/offres`);
            if (res.ok) {
              const data = await res.json();
              setOffres(data && data.length > 0 ? data : OFFRES_DEMO);
            } else {
              setOffres(OFFRES_DEMO);
            }
          } catch (e) {
            setOffres(OFFRES_DEMO);
          }
        };
        fetchOffres();
        
        // Auto fill email from localstorage
        const savedEmail = localStorage.getItem('candidat_email');
        if (savedEmail) setSuiviEmail(savedEmail);
      }, []);

      // Scroll helpers
      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const handleOpenModal = (offreId = '') => {
        setSelectedOffreId(offreId);
        setSubmissionResult(null);
        setFile(null);
        setModalOpen(true);
      };

      const handleCloseModal = () => {
        setModalOpen(false);
        setNom('');
        setEmail('');
        setFile(null);
      };

      const handleFileChange = (e) => {
        if (e.target.files.length > 0) {
          setFile(e.target.files[0]);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files.length > 0) {
          setFile(e.dataTransfer.files[0]);
        }
      };

      // Submit application
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!file) {
          alert('Veuillez déposer ou sélectionner votre CV.');
          return;
        }
        setSubmitting(true);
        setSubmissionResult(null);

        const formData = new FormData();
        formData.append('offre_id', selectedOffreId);
        formData.append('nom_candidat', nom);
        formData.append('email_candidat', email);
        formData.append('fichier_cv', file);

        try {
          const res = await fetch(`${API_BASE}/candidatures`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            setSubmissionResult(data);
            localStorage.setItem('candidat_email', email.trim());
          } else {
            setSubmissionResult({ error: true, message: data.detail || 'Erreur lors du traitement du CV.' });
          }
        } catch (err) {
          setSubmissionResult({ error: true, message: 'Impossible de joindre le serveur API.' });
        } finally {
          setSubmitting(false);
        }
      };

      // Search application
      const handleSuivi = async (e) => {
        e.preventDefault();
        if (!suiviEmail || !suiviEmail.includes('@')) {
          alert('Veuillez saisir un e-mail valide.');
          return;
        }
        setSuiviLoading(true);
        setSuiviResult(null);

        try {
          const res = await fetch(`${API_BASE}/candidatures?email=${encodeURIComponent(suiviEmail.trim())}`);
          if (res.ok) {
            const data = await res.json();
            setSuiviResult(data);
          } else {
            setSuiviResult([]);
          }
        } catch (err) {
          setSuiviResult({ error: true, message: 'Connexion serveur échouée.' });
        } finally {
          setSuiviLoading(false);
        }
      };

      return (

                            </div>

                            {file && (
                              <div class="mt-4 bg-amber-500/20 border border-amber-500/40 rounded-xl p-2.5 text-amber-300 text-xs inline-flex items-center gap-2 font-bold shadow-md">
                                <i class="fa-solid fa-file-circle-check"></i> {file.name}
                              </div>
                            )}
                          </div>
                        </div>

                        <button 
                          type="submit" 
                          disabled={submitting} 
                          class="w-full bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 hover:from-amber-400 hover:to-indigo-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 disabled:opacity-50 mt-6 active:scale-95"
                        >
                          {submitting ? (
                            <><i class="fa-solid fa-spinner fa-spin"></i> Analyse IA en cours...</>
                          ) : (
                            <><i class="fa-solid fa-paper-plane"></i> Envoyer ma candidature</>
                          )}
                        </button>

                      </form>
                    </div>
                  ) : submissionResult.error ? (
                    // ERROR VIEW
                    <div class="text-center py-10 space-y-6">
                      <div class="w-16 h-16 bg-red-500/20 border border-red-500/40 rounded-full flex items-center justify-center text-red-400 text-3xl mx-auto shadow-lg">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                      </div>
                      <div class="space-y-2">
                        <h3 class="font-outfit font-black text-xl text-white">Candidature déjà enregistrée</h3>
                        <p class="text-slate-300 text-xs max-w-sm mx-auto">{submissionResult.message}</p>
                      </div>
                      <button onClick={handleCloseModal} class="bg-indigo-950 border border-indigo-500/40 text-white font-bold text-xs px-6 py-2.5 rounded-xl hover:bg-indigo-900 transition-all">
                        Fermer la fenêtre
                      </button>
                    </div>
                  ) : (
                    // SUCCESS RESULT VIEW
                    <div class="space-y-6">
                      
                      <div class="text-center space-y-4">
                        <div class="inline-flex items-center gap-1.5 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider shadow-md">
                          ✨ Analyse complétée avec succès
                        </div>
                        <h3 class="font-outfit font-black text-2xl text-white">Résultat de votre adéquation</h3>
                      </div>

                      {/* Large Gauge */}
                      <div class="relative w-44 h-44 mx-auto flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90">
                          <circle cx="88" cy="88" r="76" class="fill-none stroke-slate-900" stroke-width="8"></circle>
                          <circle 
                            cx="88" 
                            cy="88" 
                            r="76" 
                            class="fill-none stroke-amber-400 transition-all duration-1000" 
                            stroke-width="10"
                            stroke-dasharray={2 * Math.PI * 76}
                            stroke-dashoffset={2 * Math.PI * 76 - (Math.round(submissionResult.score) / 100) * (2 * Math.PI * 76)}
                            stroke-linecap="round"
                          ></circle>
                        </svg>
                        <div class="absolute text-center space-y-0.5">
                          <span class="font-outfit font-black text-4xl text-amber-400">{Math.round(submissionResult.score)}%</span>
                          <span class="block text-[9px] text-slate-300 uppercase tracking-widest font-bold">Score adéquation</span>
                        </div>
                      </div>

                      <div class="bg-[#0F172A]/80 border border-indigo-500/30 rounded-2xl p-5 space-y-3 shadow-lg">
                        <div class="text-xs font-black text-amber-400 uppercase tracking-wider">Synthèse de l'évaluation :</div>
                        <p class="text-slate-200 text-xs leading-relaxed font-medium">{submissionResult.justification_ia || 'Votre dossier a été transmis aux équipes de recrutement pour évaluation.'}</p>
                      </div>

                      <div class="flex justify-end gap-3 pt-4">
                        <button onClick={handleCloseModal} class="bg-white hover:bg-slate-100 text-slate-900 font-extrabold text-xs px-6 py-3 rounded-xl transition-all">
                          Terminer
                        </button>
                      </div>

                    </div>
                  )}

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
