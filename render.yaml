services:
  - type: web
    name: artiweb-carrieres
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download fr_core_news_sm || true
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SENDER_EMAIL
        sync: false
